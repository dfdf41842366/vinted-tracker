services:
  - type: web
    name: vinted-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --preload
    healthCheckPath: /health
    envVars:
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SYNC_INTERVAL
        value: "15"
      - key: SYNC_DAYS_BACK
        value: "90"
      - key: PYTHON_VERSION
        value: "3.12.0"
